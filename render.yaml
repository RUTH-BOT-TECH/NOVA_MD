# Render Blueprint — the pairing site only.
#
# One press, nothing to fill in:
#   Render → New → Blueprint → pick this repo → Apply.
#
# Why only the pair site: a blueprint that also declared the bot would ask for
# SESSION_ID and OWNER_NUMBER before it deployed anything, and it would need a
# paid instance to keep a session on disk. The pair site needs none of that —
# it is diskless, free-tier, and you delete it as soon as you have the
# SESSION_ID. The bot itself is deployed afterwards, by you, wherever you like
# (see docs/DEPLOY.md → "Render, by hand").
#
# Nothing here uses `sync: false`, because every `sync: false` turns into a
# form field Render blocks the deploy on.
services:
  - type: web
    name: nova-pair
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: web                 # web/ is a standalone app: its own package.json
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start      # node server.js, listening on Render's $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_PREFIX
        value: NOVA-MD
      - key: BOT_NAME
        value: NOVA-MD
      - key: REPO_URL
        value: https://github.com/RUTH-BOT-TECH/NOVA_MD
      - key: MAX_ACTIVE
        value: 2
      - key: PAIR_ONCE
        value: "1"               # one-time link: first pairing wins, then 403
